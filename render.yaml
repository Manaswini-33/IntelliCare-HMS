services:
  # 1. Java Spring Boot Monolith Web Service (Docker)
  - type: web
    name: intellicare-hms-backend
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://YOUR_MYSQL_HOST:3306/hospital_db?useSSL=false&allowPublicKeyRetrieval=true
      - key: SPRING_DATASOURCE_USERNAME
        value: root
      - key: SPRING_DATASOURCE_PASSWORD
        value: YOUR_MYSQL_PASSWORD
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: intellicare-ml-service
          property: url

  # 2. Python FastAPI ML Service
  - type: web
    name: intellicare-ml-service
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run_service.py
    rootDir: ml-service
