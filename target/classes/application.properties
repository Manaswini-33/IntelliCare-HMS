# ===================================================================
# IntelliCare HMS
# ===================================================================
spring.application.name=IntelliCare HMS
server.port=8080

# MySQL (override with DB_URL / DB_USERNAME / DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT (override with JWT_SECRET — never commit a production secret)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

ml.service.url=${ML_SERVICE_URL:http://127.0.0.1:8000}

spring.webservices.path=/ws

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

logging.level.com.hospital.management=INFO
logging.level.org.springframework.web=INFO
